# Local API-test override for the web-and-data image. That image intentionally
# ships an exploded Spring Boot classpath instead of app.jar.
services:
  cbioportal:
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - >-
        exec java -Xms2g -Xmx4g -cp '/cbioportal-webapp:/cbioportal-webapp/lib/*'
        org.cbioportal.PortalApplication
        --spring.config.location=file:/cbioportal-webapp/application.properties
        --authenticate=false
        --session.service.url=http://cbioportal-session:5001/api/sessions/my_portal/
        --spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
        --spring.datasource.url=$${CLICKHOUSE_URL}
        --spring.datasource.username=$${CLICKHOUSE_USER}
        --spring.datasource.password=$${CLICKHOUSE_PASSWORD}
        --spring.datasource.clickhouse.url=$${CLICKHOUSE_URL}
        --spring.datasource.clickhouse.username=$${CLICKHOUSE_USER}
        --spring.datasource.clickhouse.password=$${CLICKHOUSE_PASSWORD}
        --spring.datasource.clickhouse.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
        --clickhouse_mode=true
        --spring.profiles.active=clickhouse
    volumes:
      - ${CBIOPORTAL_SOURCE_DIR}/.circleci/local-clickhouse.properties:/cbioportal-webapp/application.properties:ro
  # The docker-compose helper regenerates these mounts from the image.  A fork
  # cannot rely on that helper's environment propagation, so pin the local
  # database inputs to the checked-out PR sources as well.  This keeps the
  # local fallback on the same schema/seed as the application image.
  cbioportal-database:
    volumes:
      - ${CBIOPORTAL_SOURCE_DIR}/src/main/resources/db-scripts/clickhouse/init/schema.sql:/data/schema.sql:ro
      - ${CBIOPORTAL_SOURCE_DIR}/src/main/resources/db-scripts/clickhouse/init/seed-cbioportal_hg19_hg38_v2.14.5.sql.gz:/data/seed.sql.gz:ro
      - ${CBIOPORTAL_SOURCE_DIR}/src/main/resources/db-scripts/clickhouse/populate_derived_tables.sql:/data/clickhouse.sql:ro
