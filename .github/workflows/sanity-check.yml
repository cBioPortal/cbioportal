name: Sanity checks
on: [push, pull_request]
jobs:
  build:
    name: Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout cbioportal repo'
        uses: actions/checkout@v2
        with:
          path: ./cbioportal
      - name: 'Run tests'
        working-directory: ./cbioportal
        run: |
          bash test/test_db_version.sh
          bash test/test_truncate_sync_settings.sh
          python3 test/test_clickhouse_wsi_schema_parity.py
