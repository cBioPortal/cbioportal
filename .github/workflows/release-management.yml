name: Release Management

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - master
  # pull_request_target gives fork PRs a writable token; safe because no PR code is checked out
  pull_request_target:
    types: [labeled, unlabeled]
  workflow_dispatch:

jobs:
  update_draft_release:
    # the draft only lists merged PRs, so label changes on open PRs have nothing to update
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      # Drafts your next Release notes as Pull Requests are merged into "master"
      - uses: release-drafter/release-drafter@v7.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
