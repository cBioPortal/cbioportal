name: Third-party dependency report

on:
  pull_request:
    paths:
      - '.github/workflows/third-party-report-check.yml'
      - 'OPEN-SOURCE-DOCUMENTATION'
      - 'bom.json'
      - 'pom.xml'
      - 'scripts/generate-third-party-report.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Regenerate third-party dependency reports
        run: scripts/generate-third-party-report.sh

      - name: Check committed reports
        run: git diff --exit-code -- OPEN-SOURCE-DOCUMENTATION bom.json
