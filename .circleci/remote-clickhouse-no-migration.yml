services:
  cbioportal:
    # The keycloak Compose profile owns the Java command and does not expose
    # APP_CUSTOM_ARGS. Pass this compatibility setting through Spring's JSON
    # environment hook so the read-only clone can still serve the regression
    # suite while the WSI job remains strict on its local schema.
    environment:
      SPRING_APPLICATION_JSON: '{"db.suppress_schema_version_mismatch_errors":true}'
  # The remote ClickHouse API job must not start the local migration runner.
  # The runner resolves cbioportal-database, which is intentionally disabled
  # by the remote ClickHouse extension.
  cbioportal-migration:
    deploy:
      replicas: 0
