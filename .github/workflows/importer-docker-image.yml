# Ported from cbioportal-core's docker-image.yml. Builds importer/Dockerfile and publishes
# the standalone importer image, cbioportal/cbioportal-core.

name: Importer Docker Image CI
on:
  push:
    branches:
      - master
      - 'demo*'
    tags: '*'
    paths:
      - 'importer/**'
      - '.github/workflows/importer-docker-image.yml'

jobs:
  build_and_publish_image:
    if: github.repository == 'cBioPortal/cbioportal'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            cbioportal/cbioportal-core
          # Do not generate latest tag
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The following two actions are required to build multi-platform images
      # buildx is an extension of docker build, QEMU is used to convert the binary to various architectures
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Docker Image on Tag
        uses: docker/build-push-action@v6
        with:
          context: importer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          file: importer/Dockerfile
          # Own cache scope so this build doesn't evict the web-and-data image's cache
          cache-from: type=gha,scope=importer
          cache-to: type=gha,scope=importer
