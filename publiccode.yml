  mainCopyrightOwner: "cBioPortal contributors"

maintenance:
  type: community
  contacts:
    - name: cBioPortal Community
      email: cbioportal@cbioportal.org
      affiliation: General inquiries

localisation:
  localisationReady: false
  availableLanguages:
    - en
