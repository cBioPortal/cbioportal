# Deterministic local configuration for fork CI jobs.  The docker-compose
# helper normally generates this file from the image, but that generation
# depends on environment propagation that is unavailable for fork contexts.
app.name=cbioportal
spring.datasource.mysql.url=jdbc:ch://cbioportal-database:8123/cbioportal
spring.datasource.mysql.username=cbio_user
spring.datasource.mysql.password=somepassword
spring.datasource.mysql.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
spring.datasource.clickhouse.url=jdbc:ch://cbioportal-database:8123/cbioportal
spring.datasource.clickhouse.username=cbio_user
spring.datasource.clickhouse.password=somepassword
spring.datasource.clickhouse.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
spring.datasource.url=jdbc:ch://cbioportal-database:8123/cbioportal
spring.datasource.username=cbio_user
spring.datasource.password=somepassword
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
clickhouse_mode=true
spring.profiles.active=clickhouse
db.suppress_schema_version_mismatch_errors=false
